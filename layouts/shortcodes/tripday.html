<div class="tripday {{ .Get "side" }}">

  <div class="tripday-image">
    {{ $image := .Page.Resources.GetMatch (.Get "image") }}
    {{ if $image }}
      <img src="{{ $image.RelPermalink }}" alt="">
    {{ end }}
  </div>

  <div class="tripday-text">
    {{ .Inner | markdownify }}
  </div>

</div>
